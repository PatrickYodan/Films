# Variables locales (non versionnées) : backend/.env au format CLE=valeur, voir .env.example.
# Le second chemin couvre un lancement depuis la racine du projet (ex. bouton « Run » de l'IDE).
# Une vraie variable d'environnement l'emporte toujours sur le fichier .env.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Profil : « dev » (données de démonstration) ou « prod ». Défini dans .env (spring.profiles.active)
# ou par la variable d'environnement SPRING_PROFILES_ACTIVE. Aucun profil par défaut.

# Application
spring.application.name=ngoma
app.name=NGOMA
api-version=v1

# Serveur
server.port=8090

# DATABASE (aucune valeur par défaut : à fournir par .env ou par l'environnement)
spring.datasource.url=${NGOMA_DB_URL}
spring.datasource.username=${NGOMA_DB_USER}
spring.datasource.password=${NGOMA_DB_PASSWORD}

# Encodage
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=public
# Structure uniquement ; le profil dev ajoute les données de démonstration (application-dev.properties)
spring.flyway.locations=classpath:flyway/schema
spring.flyway.validate-on-migrate=true

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SECURITY : clé JWT encodée en Base64, 256 bits minimum (NGOMA_JWT_SECRET, sans valeur par défaut)
application.security.jwt.secret-key=${NGOMA_JWT_SECRET}
# 1 jour
application.security.jwt.expiration=86400000
# 30 jours
application.security.jwt.refresh-token.expiration=2592000000

# API
api.prefix=/ws

# Application frontend
client.base_url.local=http://localhost:4200
client.base_url.online=https://ngoma.example.com

# Paiement Mobile Money (agrégateur à choisir)
# Fournisseur actif : « simulation » (développement) ou un agrégateur réel une fois intégré.
# Sans fournisseur, l'application refuse de démarrer (aucun paiement pris par erreur).
paiement.operateur.fournisseur=${NGOMA_PAIEMENT_FOURNISSEUR:}
paiement.operateur.base_url=
paiement.operateur.cle_api=${NGOMA_PAIEMENT_CLE:}
paiement.operateur.secret_webhook=${NGOMA_PAIEMENT_SECRET:}
paiement.delai_expiration_minutes=15
# Vérification de secours des paiements en attente auprès de l'opérateur
paiement.verification.intervalle=PT30S

# Stockage des vidéos (CDN / stockage objet)
video.cdn.base_url=https://cdn.ngoma.example.com
video.url_signee.duree_minutes=240

# Envoi de fichiers : 5 Mo (affiches / bandeaux). La photo de profil reste limitée à 2 Mo dans UtilisateurFacade.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Stockage local des images (développement) : servi sur /medias/**
ngoma.stockage.dossier=${NGOMA_STOCKAGE_DOSSIER:uploads}
ngoma.stockage.url_publique=${NGOMA_STOCKAGE_URL:http://localhost:8090/medias}
# Taille maximale d'un fichier vidéo envoyé depuis le back-office (envoyé en flux, hors limite multipart)
ngoma.video.taille_max=4GB
# Les navigateurs exigent le type text/vtt pour afficher les sous-titres
server.mime-mappings.vtt=text/vtt
