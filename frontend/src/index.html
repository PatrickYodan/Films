<!doctype html>
<html lang="fr" class="ngoma-chargement">
<head>
  <meta charset="utf-8">
  <title>NGOMA — Films africains en streaming</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NGOMA : le cinéma africain en streaming, payable par Mobile Money, même en 3G.">
  <meta name="theme-color" content="#06060C">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    /* ===== Préchargeur NGOMA : affiché avant le démarrage d'Angular, retiré par PreloaderService ===== */
    @property --ngp-lumiere { syntax: '<color>'; inherits: true; initial-value: #f2b65a; }
    html.ngoma-chargement, html.ngoma-chargement body { overflow: hidden; }
    .ngp {
      --ngp-lumiere: #f2b65a;
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      background: #06060c; color: #f4eee6;
      font-family: Inter, 'Segoe UI', system-ui, sans-serif;
      animation: ngp-lumiere 9s ease-in-out infinite;
      transition: opacity .7s cubic-bezier(.25,.8,.25,1), visibility .7s;
    }
    .ngp-scene { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; animation: ngp-apparition 1s ease both; }
    .ngp-svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .8s cubic-bezier(.25,.8,.25,1); transform-origin: 50% 32%; }
    .ngp-scene::after { content: ''; position: absolute; inset: auto 0 0; height: 30%; background: linear-gradient(transparent, #06060c); pointer-events: none; }
    .ngp-texte { position: relative; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 8px 20px max(36px, 6vh); text-align: center; }
    .ngp-marque { display: flex; align-items: center; gap: 12px; animation: ngp-monte .9s .35s cubic-bezier(.25,.8,.25,1) both; }
    .ngp-logo { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 13px; background: #e9a23b; color: #12100e; }
    .ngp-nom { font-family: Syne, 'Segoe UI', sans-serif; font-weight: 800; font-size: 2rem; letter-spacing: .14em; }
    .ngp-accroche { margin: 0; color: #c9bfb2; font-size: clamp(.95rem, 2.4vw, 1.12rem); letter-spacing: .01em; animation: ngp-monte .9s .5s cubic-bezier(.25,.8,.25,1) both; }
    .ngp-barre { position: relative; width: min(260px, 70vw); height: 3px; margin-top: 6px; overflow: hidden; border-radius: 99px; background: rgb(244 238 230 / 12%); animation: ngp-monte .9s .65s cubic-bezier(.25,.8,.25,1) both; }
    .ngp-barre span { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, #e9a23b, var(--ngp-lumiere)); transform-origin: left; transform: scaleX(0); }
    .ngp-progression { animation: ngp-progression 6.2s cubic-bezier(.3,.55,.45,1) .2s forwards; }
    .ngp-fin { opacity: 0; }
    .ngp-passer { color: #857b70; font-size: .78rem; letter-spacing: .04em; opacity: 0; animation: ngp-indice .8s 2.5s ease forwards; }
    .ngp { cursor: pointer; }
    .ngp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Scène */
    .ngp-ombre { fill: #05050a; }
    .ngp-siege { fill: #0c0e1d; }
    .ngp-halo { animation: ngp-respire 5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .ngp-ecran-allume { animation: ngp-allumage 1.1s .15s cubic-bezier(.2,.9,.2,1) both; transform-origin: 600px 225px; }
    .ngp-film { animation: ngp-scintille 3.4s steps(1) infinite; }
    .ngp-soleil { animation: ngp-soleil 7s ease-in-out infinite alternate; }
    .ngp-paysage { animation: ngp-travelling 16s ease-in-out infinite alternate; }
    .ngp-faisceau { animation: ngp-respire 5s ease-in-out infinite; }
    .ngp-rim { animation: ngp-scintille-doux 3.4s ease-in-out infinite; }
    .ngp-poussieres circle { opacity: 0; animation: ngp-poussiere 7s linear infinite; animation-delay: var(--d); }
    .ngp-tete { transform-box: fill-box; transform-origin: 50% 100%; }
    .ngp-bouge-a { animation: ngp-tete-a 7s ease-in-out infinite; }
    .ngp-bouge-b { animation: ngp-tete-b 9s ease-in-out infinite; }
    .ngp-bouge-c { animation: ngp-tete-a 11s ease-in-out -3s infinite reverse; }
    .ngp-couple { animation: ngp-couple 8s ease-in-out infinite; }
    .ngp-popcorn { animation: ngp-popcorn 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    /* Deux silhouettes qui traversent la savane sur l'écran : une femme portant un panier et un enfant */
    .ngp-marcheurs { animation: ngp-traversee 22s linear infinite; }
    .ngp-corps { animation: ngp-rebond .38s ease-in-out infinite alternate; }
    .ngp-corps-enfant { animation-duration: .27s; }
    .ngp-jambe, .ngp-bras { transform-box: fill-box; transform-origin: 50% 0; }
    .ngp-pas-a { animation: ngp-pas .76s ease-in-out infinite alternate; }
    .ngp-pas-b { animation: ngp-pas .76s ease-in-out infinite alternate-reverse; }
    .ngp-pas-enfant-a { animation: ngp-pas .54s ease-in-out infinite alternate; }
    .ngp-pas-enfant-b { animation: ngp-pas .54s ease-in-out infinite alternate-reverse; }
    .ngp-place-libre { stroke: #e9a23b; stroke-opacity: .35; stroke-width: 2; stroke-dasharray: 6 8; animation: ngp-respire 3s ease-in-out infinite; }

    /* Fin du chargement : barre complète, puis zoom vers l'écran et fondu */
    .ngp-termine .ngp-progression { animation-play-state: paused; }
    .ngp-termine .ngp-fin { opacity: 1; animation: ngp-fin .28s ease-out forwards; }
    .ngp-sortie { opacity: 0; visibility: hidden; }
    .ngp-sortie .ngp-svg { transform: scale(1.12); }

    @keyframes ngp-lumiere { 0%, 100% { --ngp-lumiere: #f2b65a; } 33% { --ngp-lumiere: #6f9cff; } 66% { --ngp-lumiere: #b57cff; } }
    @keyframes ngp-apparition { from { opacity: 0; } }
    @keyframes ngp-monte { from { opacity: 0; transform: translateY(14px); } }
    @keyframes ngp-allumage { 0% { transform: scale(1, .01); opacity: 0; } 35% { transform: scale(1, .01); opacity: 1; } 100% { transform: scale(1, 1); } }
    @keyframes ngp-respire { 50% { opacity: .78; } }
    @keyframes ngp-scintille { 0%, 100% { opacity: 1; } 41% { opacity: .93; } 43% { opacity: 1; } 77% { opacity: .96; } 79% { opacity: 1; } }
    @keyframes ngp-scintille-doux { 50% { opacity: .82; } }
    @keyframes ngp-soleil { to { transform: translateY(26px); } }
    @keyframes ngp-travelling { to { transform: translateX(-150px); } }
    @keyframes ngp-poussiere { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: .55; } 80% { opacity: .35; } 100% { opacity: 0; transform: translate(14px, -70px); } }
    @keyframes ngp-tete-a { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-3deg); } 60% { transform: rotate(2deg); } }
    @keyframes ngp-tete-b { 0%, 100% { transform: rotate(0) translateY(0); } 50% { transform: rotate(2.5deg) translateY(1px); } }
    @keyframes ngp-couple { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(1.5deg); } }
    @keyframes ngp-popcorn { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-5px) rotate(-3deg); } 90% { transform: translateY(0); } }
    @keyframes ngp-traversee { from { transform: translateX(-120px); } to { transform: translateX(480px); } }
    @keyframes ngp-pas { from { transform: rotate(24deg); } to { transform: rotate(-24deg); } }
    @keyframes ngp-rebond { to { transform: translateY(-1.2px); } }
    @keyframes ngp-indice { to { opacity: 1; } }
    @keyframes ngp-progression { to { transform: scaleX(.92); } }
    @keyframes ngp-fin { from { transform: scaleX(.92); } to { transform: scaleX(1); } }

    @media (max-width: 600px) {
      .ngp-nom { font-size: 1.6rem; }
      .ngp-logo { width: 38px; height: 38px; border-radius: 11px; }
    }
    /* Réduction des animations : scène fixe, barre simple, simple fondu à la fin */
    @media (prefers-reduced-motion: reduce) {
      .ngp, .ngp *, .ngp-scene { animation: none !important; }
      .ngp-progression { transform: scaleX(.6); }
      .ngp-termine .ngp-fin { opacity: 1; transform: scaleX(1); }
      .ngp-sortie .ngp-svg { transform: none; }
    }
  </style>
  <noscript><style>html.ngoma-chargement, html.ngoma-chargement body { overflow: auto; } #ngoma-preloader { display: none; }</style></noscript>
